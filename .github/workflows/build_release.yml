name: Build Release (Windows EXE & Android APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Compress Windows Release
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\vlc-player-windows-x64.zip

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlc-player-windows-x64
          path: build/vlc-player-windows-x64.zip

  create-release:
    name: Create GitHub Release
    needs: [build-apk, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-artifacts/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: vlc-player-windows-x64
          path: release-artifacts/

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Release v1.0.0: Windows EXE & Android APK"
          body: |
            ## ISPC / VLC Player Release v1.0.0
            
            ### Downloads:
            - **Windows Desktop:** `vlc-player-windows-x64.zip` (extract and run `vlc_player.exe`)
            - **Android:** `app-release.apk`
          files: |
            release-artifacts/app-release.apk
            release-artifacts/vlc-player-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
