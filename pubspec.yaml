name: vlc_player
description: VLC-inspired mobile media player for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Media playback (already cached — fast builds)
  video_player: ^2.9.2
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  ffmpeg_kit_flutter_new: ^4.6.3

  # File access & permissions
  file_picker: ^13.1.0
  permission_handler: ^11.4.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # Storage
  shared_preferences: ^2.3.3

  # State management
  provider: ^6.1.2

  # UI
  wakelock_plus: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

